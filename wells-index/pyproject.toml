[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "wells-index"
version = "0.2.0"
description = "Fast structural repository indexer for Wells"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Wells Contributors", email = "dev@example.com"}]
license = {text = "MIT OR Apache-2.0"}
keywords = ["indexing", "code-search", "tree-sitter", "symbolic", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "black>=24.0", "ruff>=0.4"]

[tool.maturin]
# abi3-py312: stable-ABI wheels. One wheel per platform installs on EVERY
# CPython >= 3.12 (3.14, 3.15, ...) forever — no per-version rebuilds, and
# downstream packages can depend on us without pinning their users' Python.
features = ["pyo3/extension-module", "pyo3/abi3-py312"]
python-source = "python"
module-name = "wells_index._core"
# Pre-built cores committed for the no-toolchain install path (wells.bat /
# repair_index_core). They must not ride along inside built wheels.
exclude = ["python/wells_index/_core.*.pyd", "python/wells_index/*.so"]
