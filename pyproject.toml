[project]
name = "wells-agent"
version = "0.4.0"
description = "Wells — a model-agnostic, self-improving agentic coding harness (planner/architect/coder/tester/reviewer) with deterministic test-gate verification, Code Mode, SEACS evolution, ACP + MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.0.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.6",
    "mcp>=1.28.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.2",
    "textual>=1.0.0",
    "rich>=15.0.0",
    "truststore>=0.9.1",
    "watchdog>=4.0",
    # abi3 (stable-ABI) native wheels since 0.2.0: one wheel per platform
    # installs on every CPython >= 3.12, so this is safe as a hard dependency
    # (it was NOT before abi3 — see 0.3.0, where cp312/cp313-only wheels made
    # the whole package unresolvable on newer interpreters).
    "wells-index>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/corbybender/Wells"
Documentation = "https://github.com/corbybender/Wells#contents"
Issues = "https://github.com/corbybender/Wells/issues"
Changelog = "https://github.com/corbybender/Wells/commits/master"
Repository = "https://github.com/corbybender/Wells"

[project.scripts]
wells = "wells.main:main"
wells-mcp = "wells.mcp_server:main"
wells-acp = "wells.acp_server:main"

[project.optional-dependencies]
# Semantic code retrieval (cosine-similarity search over local BGE embeddings).
# Install with:  pip install 'wells-agent[embeddings]'
embeddings = [
    "fastembed>=0.3.0",
    "sqlite-vec>=0.1.6",
]
# Browser-driving tools (browser_navigate/click/type/read/screenshot).
# Install with:  pip install 'wells-agent[browser]'  then:  playwright install chromium
browser = [
    "playwright>=1.48.0",
]
# Durable project memory (BigBrain transaction-log -> curated memory files).
# Install with:  pip install 'wells-agent[memory]'
# The harness degrades gracefully when it is absent, so the extra is optional.
memory = [
    "bigbrain-memory>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# bigbrain-memory is referenced by git URL in [project.optional-dependencies].
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wells"]
# (No force-includes needed: AGENT.md and builtin_skills/ live under
# src/wells/, which `packages` already ships in full. The old force-include
# duplicated paths and broke the wheel build.)

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "wells-index>=0.2.0",
]
